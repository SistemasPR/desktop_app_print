<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #111827;
            color: #ffffff;

            overflow: hidden;
        }

        .splash {
            text-align: center;
        }

        .logo {
            width: 100px;
            margin-bottom: 20px;
        }

        .title {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .message {
            margin-top: 8px;
            font-size: 13px;
            opacity: .7;
        }

        .loader {
            width: 32px;
            height: 32px;

            margin: 24px auto 0;

            border: 3px solid rgba(255, 255, 255, .2);
            border-top-color: white;
            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="splash">

        <img
            src="./images/pizzara_raul_ico.png"
            class="logo"
            alt="Logo"
        >

        <h1 class="title">
            Print Service
        </h1>

        <div class="loader"></div>

        <div class="message">
            Iniciando servicio de impresión...
        </div>

    </div>

</body>
</html>
